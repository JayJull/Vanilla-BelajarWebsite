<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
    <app-header></app-header>
    
    <main class="container">
        <div id="add-note" class="content">
            <note-form></note-form>
        </div>
        
        <div id="view-notes" class="content">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search notes...">
            </div>
            <h2>Your Notes</h2>
            <div class="notes-grid" id="notesContainer"></div>
        </div>
        
        <div id="archived-notes" class="content">
            <h2>Archived Notes</h2>
            <div class="notes-grid" id="archivedContainer"></div>
        </div>
    </main>
    
    <footer class="container">
        <p>Izza Fakhrul &copy; 2025 Notes App
        </p>
    </footer>

    <script type="module" src="src/js/script.js"></script>
</body>
</html>
